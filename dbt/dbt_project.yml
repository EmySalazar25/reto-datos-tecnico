name: estandar
version: "1.0.0"
config-version: 2
profile: estandar

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

flags:
  send_anonymous_usage_stats: false

models:
  estandar:
    staging:
      +schema: staging
      +materialized: view
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
    mart:
      +materialized: table
      logistica:
        +schema: mart_logistica

vars:
  # Regla 2: qué estatus cuentan como embarcado.
  estatus_embarcado: ["TRA", "ENT"]
  # Zona horaria en la que el origen captura las fechas (diccionario de landing).
  zona_horaria_origen: "America/Monterrey"
  # Supuesto S2: hora local de cada planta según su país (el origen no la trae).
  zona_horaria_por_pais:
    MX: "America/Monterrey"
    US: "America/Chicago"
