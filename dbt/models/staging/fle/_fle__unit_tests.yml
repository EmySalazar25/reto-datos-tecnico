version: 2

unit_tests:
  - name: ut_cdc_ultima_version_por_lsn_y_borrados
    description: >
      Dos versiones con el mismo _ab_cdc_updated_at: gana la de mayor LSN, comparado como número
      (10 > 9). Si la última versión es un borrado, el viaje desaparece. El estatus se normaliza
      y la fecha centinela 1900-01-01 se vuelve nula.
    model: stg_fle__viajes
    config:
      tags: [engineering]
      meta:
        verifica: deduplicacion_cdc
    # En un unit test dbt no expone el grafo; la llave de la fuente se fija para el fixture.
    overrides:
      macros:
        llave_fuente: [IdViaje]
    given:
      - input: source('landing_fle', 'fle_viaje')
        rows:
          - {IdViaje: "1", ClaPlanta: "1", Estatus: "ENT", CostoFlete: "100.00", _ab_cdc_lsn: "9", _ab_cdc_updated_at: "2026-01-05T16:00:00.000Z"}
          - {IdViaje: "1", ClaPlanta: "1", Estatus: "ENT", CostoFlete: "115.00", _ab_cdc_lsn: "10", _ab_cdc_updated_at: "2026-01-05T16:00:00.000Z"}
          - {IdViaje: "2", ClaPlanta: "1", Estatus: "TRA", CostoFlete: "50.00", _ab_cdc_lsn: "20", _ab_cdc_updated_at: "2026-01-06T10:00:00.000Z"}
          - {IdViaje: "2", ClaPlanta: "1", Estatus: "TRA", CostoFlete: "50.00", _ab_cdc_lsn: "21", _ab_cdc_updated_at: "2026-01-07T10:00:00.000Z", _ab_cdc_deleted_at: "2026-01-07T10:00:00.000Z"}
          - {IdViaje: "3", ClaPlanta: "2", Estatus: " tra ", CostoFlete: "80.00", FechaRealEmbarque: "1900-01-01 00:00:00", FechaEmbarqueFinal: "2026-01-08 08:00:00", _ab_cdc_lsn: "30", _ab_cdc_updated_at: "2026-01-08T10:00:00.000Z"}
    expect:
      rows:
        - {id_viaje: 1, estatus: ENT, costo_flete_mxn: 115.00, fecha_real_embarque: null}
        - {id_viaje: 3, estatus: TRA, costo_flete_mxn: 80.00, fecha_real_embarque: null}
